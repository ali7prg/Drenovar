name: DRENOVAR iOS test IPA (repack on Linux)

# GitHub does not assign macOS arm64 runners to this repository ("not acquired by
# Runner of type hosted", "configuration not supported"). This workflow builds the
# test IPA without macOS from the reduced engine capsule of the device-tested 0.5.9
# IPA (godot/ios-engine, pinned hashes): the Godot 4.6.3 engine and app files are
# reused byte-for-byte, the game pack is exported here from this commit.
# The IPA is unsigned; SideStore/AltStore re-sign it on install.

# 1022: never on routine pushes. Run it by hand (workflow_dispatch), or change
# godot/ios-build-request.txt on the 1022 branch: that file alone starts a build.
# (Added after the 1021+forest merge landed, so the merge push itself could not start one.)
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-babbage-4swyw3]
    paths: [godot/ios-build-request.txt]


permissions:
  contents: write

concurrency:
  # One group per branch for push and pull_request alike (github.ref differs:
  # refs/heads/X vs refs/pull/N/merge). Both events used to build the same
  # build number at once and race on one release (1018: the push run failed on
  # "asset already exists"). Queued, the second run finds the IPA published
  # and leaves it untouched.
  group: ios-repack-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.3

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: |
          version=$(grep -oP 'application/short_version="\K[^"]+' godot/project/export_presets.cfg)
          build=$(grep -oP '^application/version="\K[^"]+' godot/project/export_presets.cfg)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ipa=DRENOVAR-game-$build.ipa" >> "$GITHUB_OUTPUT"
          # The release step needs these notes; fail now, not after the 15-minute export (1023 run 141).
          notes="godot/runtime-audit-$build/RELEASE-RU.md"
          test -s "$notes" || { echo "::error::$notes is missing: write the release notes for build $build first."; exit 1; }
      - name: Verify the engine capsule (pinned hashes)
        run: |
          meta=godot/ios-engine/engine-capsule.json
          file=$(python3 -c "import json;print(json.load(open('$meta'))['file'])")
          sha=$(python3 -c "import json;print(json.load(open('$meta'))['sha256'])")
          echo "$sha  $file" | sha256sum -c -
          echo "CAPSULE=$file" >> "$GITHUB_ENV"
          echo "CAPSULE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Install Godot and the iOS export template
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          python3 godot/tools/ios-template.py "$templates/ios.zip"
          echo "${GODOT_VERSION}.stable" > "$templates/version.txt"
      - name: Generate and verify V6 native buildings and siege model
        run: DRENOVAR_GODOT_BIN="$GODOT_BIN" python3 godot/art/buildings-v6/build_all.py --native-only --package-dir "$RUNNER_TEMP/v6-art"
      - name: Export the game pack from this commit
        run: |
          python3 godot/tools/texture_import_policy.py godot/project --check
          bash godot/tools/package-ios.sh "$RUNNER_TEMP/export"
          test -s "$RUNNER_TEMP/export/DRENOVAR.pck"
          # every runtime JSON (game data, forest adventure data) must be in the pack
          python3 godot/tools/check-ios-pack.py "$RUNNER_TEMP/export/DRENOVAR.pck"
      - name: Verify interactive entry, account screen, both maps and unchanged model coverage
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/empty-game-profile" timeout 300 "$GODOT_BIN" --headless --main-pack "$RUNNER_TEMP/export/DRENOVAR.pck" -s "$GITHUB_WORKSPACE/godot/tools/verify_playable_pack.gd" 2>&1 | tee "$RUNNER_TEMP/verify.log"
          ! grep -q 'SCRIPT ERROR\|ERROR:' "$RUNNER_TEMP/verify.log"
          grep -q '"failures":\[\]' "$RUNNER_TEMP/verify.log"
          cp "$RUNNER_TEMP/export/DRENOVAR.pck" "$RUNNER_TEMP/DRENOVAR-game-${{ steps.meta.outputs.build }}.pck"
      - name: Repack onto the engine capsule
        run: |
          python3 godot/tools/repack_engine_capsule.py "$CAPSULE" "$RUNNER_TEMP/export/DRENOVAR.pck" \
            "$RUNNER_TEMP/${{ steps.meta.outputs.ipa }}" --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build }}" --bundle-id com.drenovar.game.v6test --expect-capsule-sha256 "$CAPSULE_SHA" | tee "$RUNNER_TEMP/repack.json"
          ( cd "$RUNNER_TEMP" && sha256sum "${{ steps.meta.outputs.ipa }}" > SHA256.txt && echo "commit ${GITHUB_SHA}" >> SHA256.txt && cat repack.json >> SHA256.txt )
      - name: Bundle review evidence
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile,os
          root=Path('godot/runtime-audit-${{ steps.meta.outputs.build }}')
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'DRENOVAR-game-evidence-${{ steps.meta.outputs.build }}.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root))
              z.write(Path(os.environ['RUNNER_TEMP'])/'verify.log','exported-pack-verification.log')
          PYCODE
          (cd "$RUNNER_TEMP" && sha256sum DRENOVAR-game-${{ steps.meta.outputs.build }}.pck DRENOVAR-game-evidence-${{ steps.meta.outputs.build }}.zip >> SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ipa }}
          path: |
            ${{ runner.temp }}/${{ steps.meta.outputs.ipa }}
            ${{ runner.temp }}/SHA256.txt
            ${{ runner.temp }}/DRENOVAR-game-${{ steps.meta.outputs.build }}.pck
            ${{ runner.temp }}/DRENOVAR-game-evidence-${{ steps.meta.outputs.build }}.zip
          retention-days: 30
      - name: Publish as a test pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-test-v${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build }}"
          # A published test build is immutable: a new IPA needs a new build number.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${{ steps.meta.outputs.ipa }}"; then
            echo "::notice::$tag already holds ${{ steps.meta.outputs.ipa }}; not overwritten. Bump application/version in export_presets.cfg for a new IPA."
            exit 0
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "DRENOVAR — игровая сборка ${{ steps.meta.outputs.build }}" --notes-file "godot/runtime-audit-${{ steps.meta.outputs.build }}/RELEASE-RU.md"
          gh release upload "$tag" "$RUNNER_TEMP/${{ steps.meta.outputs.ipa }}" "$RUNNER_TEMP/SHA256.txt" "$RUNNER_TEMP/DRENOVAR-game-${{ steps.meta.outputs.build }}.pck" "$RUNNER_TEMP/DRENOVAR-game-evidence-${{ steps.meta.outputs.build }}.zip"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/${{ steps.meta.outputs.ipa }}"
