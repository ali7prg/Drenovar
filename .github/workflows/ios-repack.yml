name: DRENOVAR iOS test IPA (repack on Linux)

# GitHub does not assign macOS arm64 runners to this repository ("not acquired by
# Runner of type hosted", "configuration not supported"). This workflow builds the
# test IPA without macOS: the Godot 4.6.3 engine executable of the device-tested
# 0.5.9 IPA is reused byte-for-byte (hash-checked) and only the game pack
# (DRENOVAR.pck, exported here from this commit) and version fields change.
# The IPA is unsigned; SideStore/AltStore re-sign it on install.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [godot/**, .github/workflows/ios-repack.yml]

permissions:
  contents: write

concurrency:
  group: ios-repack-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: |
          version=$(grep -oP 'application/short_version="\K[^"]+' godot/project/export_presets.cfg)
          build=$(grep -oP '^application/version="\K[^"]+' godot/project/export_presets.cfg)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ipa=DRENOVAR-iOS-v$version-test.ipa" >> "$GITHUB_OUTPUT"
      - name: Fetch the device-tested base IPA
        run: |
          url=$(python3 -c "import json;print(json.load(open('godot/tools/base-ipa.json'))['url'])")
          sha=$(python3 -c "import json;print(json.load(open('godot/tools/base-ipa.json'))['ipa_sha256'])")
          if ! curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/base.ipa"; then
            echo "::error::Base IPA not available at $url. Upload DRENOVAR-iOS-v0.5.9-test.ipa to the release base-ipa-0.5.9."
            exit 1
          fi
          echo "$sha  $RUNNER_TEMP/base.ipa" | sha256sum -c -
      - name: Install Godot and the iOS export template
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          python3 godot/tools/ios-template.py "$templates/ios.zip"
          echo "${GODOT_VERSION}.stable" > "$templates/version.txt"
      - name: Export the game pack from this commit
        run: |
          python3 godot/tools/texture_import_policy.py godot/project --check
          bash godot/tools/package-ios.sh "$RUNNER_TEMP/export"
          test -s "$RUNNER_TEMP/export/DRENOVAR.pck"
      - name: Pack boots and loads all ten soldiers
        run: |
          timeout 300 "$GODOT_BIN" --headless --main-pack "$RUNNER_TEMP/export/DRENOVAR.pck" -s "$GITHUB_WORKSPACE/godot/tools/verify_pck.gd" | tee "$RUNNER_TEMP/verify.log"
          grep -q "TROOP_SCENES_OK 20 of 20" "$RUNNER_TEMP/verify.log"
      - name: Repack
        run: |
          exe=$(python3 -c "import json;print(json.load(open('godot/tools/base-ipa.json'))['executable_sha256'])")
          python3 godot/tools/repack-tested-engine.py "$RUNNER_TEMP/base.ipa" "$RUNNER_TEMP/export/DRENOVAR.pck" \
            "$RUNNER_TEMP/${{ steps.meta.outputs.ipa }}" --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build }}" --expect-executable-sha256 "$exe" | tee "$RUNNER_TEMP/repack.log"
          ( cd "$RUNNER_TEMP" && sha256sum "${{ steps.meta.outputs.ipa }}" > SHA256.txt && echo "commit ${GITHUB_SHA}" >> SHA256.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ipa }}
          path: |
            ${{ runner.temp }}/${{ steps.meta.outputs.ipa }}
            ${{ runner.temp }}/SHA256.txt
          retention-days: 30
      - name: Publish as a test pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-test-v${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build }}"
          notes="Test build for SideStore. Unsigned (SideStore re-signs). Engine executable reused from the device-tested 0.5.9 IPA; game pack exported from commit ${GITHUB_SHA}. Not an App Store release."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "DRENOVAR iOS ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.build }}) test" --notes "$notes"
          gh release upload "$tag" "$RUNNER_TEMP/${{ steps.meta.outputs.ipa }}" "$RUNNER_TEMP/SHA256.txt" --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/${{ steps.meta.outputs.ipa }}"
