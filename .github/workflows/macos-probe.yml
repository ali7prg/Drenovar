name: macOS runner availability probe

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/macos-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-14, macos-13, macos-15]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version && uname -m
