name: Restore pinned DRENOVAR Godot assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-drenovar-assets.yml

permissions:
  contents: write

concurrency:
  group: drenovar-pinned-source-assets
  cancel-in-progress: false

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout authoritative GitHub import
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore only matching 0.5.9 binary originals from the live asset host
        run: node godot/tools/restore-pinned-originals.mjs

      - name: Compare recovered assets to the complete original inventory
        run: python3 godot/tools/verify_drenovar_asset_snapshot.py --minimum-present 2

      - name: Commit byte-for-byte verified source assets and recovery report
        shell: bash
        run: |
          set -euo pipefail
          git add -f godot/project/assets docs/ASSET_RESTORE_CHECK.json docs/UPSTREAM_ASSET_FETCH.json
          if git diff --cached --quiet; then
            echo 'No additional verified originals are available.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Restore byte-verified original DRENOVAR binary assets'
          git push origin HEAD:main
